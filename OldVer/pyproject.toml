[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obd2-ai-tool"
version = "0.1.4"
description = "AI-powered OBD2 diagnostic tool with J2534 support and Claude MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # OBD-II Mode 01/02/03/04 PID layer
    "obd>=0.7.3",
    # UDS ISO-14229 protocol
    "udsoncan>=1.25.2",
    # ISO-TP transport (user-space, works with python-can)
    "can-isotp>=2.0.7",
    # CAN bus hardware abstraction (J2534 backend, SocketCAN, etc.)
    "python-can>=4.4.2",
    # Anthropic MCP SDK (exposes tools to Claude)
    "mcp[cli]>=1.0.0",
    # Anthropic API (for direct API calls if needed alongside MCP)
    "anthropic>=0.40.0",
    # Async support
    "anyio>=4.0.0",
    # Config management
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # CLI
    "typer>=0.12.0",
    # Logging
    "rich>=13.0.0",
    # DBC/KCD CAN signal database parsing (SavvyCAN-compatible)
    "cantools>=39.0.0",
    # Standalone GUI scan tool
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
obd2-mcp = "obd2_mcp.server:main"
obd2-cli  = "obd2_mcp.cli:app"
obd2-gui  = "obd2_mcp.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["obd2_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
